<!DOCTYPE html>
<html lang="pt">
<head>
  <title>Login - Confidencia</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='login_v1/images/icons/favicon.ico') }}"/>

  <!-- CSS Files -->
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='login_v1/vendor/bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='login_v1/fonts/font-awesome-4.7.0/css/font-awesome.min.css') }}">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='login_v1/vendor/animate/animate.css') }}">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='login_v1/vendor/css-hamburgers/hamburgers.min.css') }}">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='login_v1/vendor/select2/select2.min.css') }}">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='login_v1/css/util.css') }}">
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='login_v1/css/main.css') }}">
</head>
<style>
    .toggle-password {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #999;
    }
  </style>
<body>

  <div class="limiter">
    <div class="container-login100">
      <div class="wrap-login100">
        
        <div class="login100-pic js-tilt" data-tilt>
          <img src="{{ url_for('static', filename='login_v1/images/confidencia-logo.png') }}" alt="IMG">
        </div>
          



        <form method="POST" action="{{ url_for('login') }}" class="login100-form validate-form">
          <span class="login100-form-title">
            Welcome Back 
          </span>

          <div class="wrap-input100 validate-input" data-validate="Email válido é obrigatório">
            <input class="input100" type="email" name="email" placeholder="Email" required>
            <span class="focus-input100"></span>
            <span class="symbol-input100">
              <i class="fa fa-envelope" aria-hidden="true"></i>
            </span>
          </div>
          {% if erro %}
           <div class="alert alert-danger text-center" role="alert">
              {{ erro }}
           </div>
         {% endif %}


<div class="wrap-input100 validate-input" data-validate="Senha é obrigatória" style="position: relative;">
            <input class="input100" type="password" name="senha" id="senha" placeholder="Senha" required>
            <span class="focus-input100"></span>
            <span class="symbol-input100">
              <i class="fa fa-lock" aria-hidden="true"></i>
            </span>
            <span class="toggle-password" onclick="togglePassword()">
              <i class="fa fa-eye" id="eyeIcon"></i>
            </span>
          </div>

          <div class="container-login100-form-btn">
            <button class="login100-form-btn" type="submit">
              Entrar
            </button>
          </div>
<div class="text-center p-t-12">
  <span class="txt1">
    Forgot
  </span>
  <a class="txt2" href="#">
    Username / Password?
  </a>
   
</div>
 

        </form>

      </div>
    </div>
  </div>
  
  <!-- Scripts -->
  <script src="{{ url_for('static', filename='login_v1/vendor/jquery/jquery-3.2.1.min.js') }}"></script>
  <script src="{{ url_for('static', filename='login_v1/vendor/bootstrap/js/popper.js') }}"></script>
  <script src="{{ url_for('static', filename='login_v1/vendor/bootstrap/js/bootstrap.min.js') }}"></script>
  <script src="{{ url_for('static', filename='login_v1/vendor/select2/select2.min.js') }}"></script>
  <script src="{{ url_for('static', filename='login_v1/vendor/tilt/tilt.jquery.min.js') }}"></script>
  <script>
    $('.js-tilt').tilt({ scale: 1.1 })
  </script>
  <script src="{{ url_for('static', filename='login_v1/js/main.js') }}"></script>
</body>
</html>
<script>
    $('.js-tilt').tilt({ scale: 1.1 });

    function togglePassword() {
      const input = document.getElementById("senha");
      const icon = document.getElementById("eyeIcon");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }

    // Esconde alerta de erro após 4 segundos
    setTimeout(function() {
      const alert = document.querySelector('.alert');
      if (alert) {
        alert.classList.add('fade');
        setTimeout(() => alert.remove(), 500);
      }
    }, 4000);
  </script>
