{% extends "public/index.html" %}

{% block title %}Início - Sistema Confidencia{% endblock %}

{% block content %}
<section class="section dashboard">
  <div class="container">
    <div class="row align-items-center text-center text-md-start">
      <!-- Texto -->
      <div class="col-md-6 mb-4 mb-md-0">
        <h2 class="fw-bold" style="font-size: 2rem;">Bem-vindo ao Sistema Confidencia</h2>
        <p class="lead">Submeta denúncias e reclamações de forma segura e anónima.</p>
      </div>

      <!-- Imagem -->
      <div class="col-md-6 text-center">
        <img src="{{ url_for('static', filename='assets/img/confidencia-logo.png') }}"
             alt="Logo Sistema"
             class="img-fluid"
             style="max-width: 400px; height: auto;">
      </div>
    </div>
  </div>
</section>

{% endblock %}
